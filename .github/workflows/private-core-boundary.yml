name: Proteção do motor privado CEPV
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prevent-private-core-leaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verificar fronteira público/privado
        run: node tools/check-public-boundary.mjs
